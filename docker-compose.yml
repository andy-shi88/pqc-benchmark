version: '3.8'

services:
  pqc-benchmark-unconstrained:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-benchmark-unconstrained
    volumes:
      - ./app.py:/app/app.py
      - ./crypto:/app/crypto
      - ./results:/app/results
    command: ["python3", "app.py"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '1.0'
          memory: 512M

  pqc-benchmark-moderate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-benchmark-moderate
    volumes:
      - ./app.py:/app/app.py
      - ./crypto:/app/crypto
      - ./results:/app/results
    command: ["python3", "app.py"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.5'
          memory: 128M

  pqc-benchmark-extreme:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-benchmark-extreme
    volumes:
      - ./app.py:/app/app.py
      - ./crypto:/app/crypto
      - ./results:/app/results
    command: ["python3", "app.py"]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.25'
          memory: 64M
